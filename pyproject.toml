[project]
name = "billwright"
version = "0.2.1"
description = "Invoices and year-end accounts, typeset as PDFs from plain TOML"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Daniel Vogler" }]
keywords = [
    "invoice",
    "invoicing",
    "qr-bill",
    "swiss-qr-bill",
    "accounting",
    "annual-accounts",
    "pdf",
    "weasyprint",
    "toml",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.7",
    "qrbill>=1.2",
    "weasyprint>=66",
]

[project.urls]
Homepage = "https://github.com/danielvogler/billwright"
Source = "https://github.com/danielvogler/billwright"
Issues = "https://github.com/danielvogler/billwright/issues"
Changelog = "https://github.com/danielvogler/billwright/blob/main/CHANGELOG.md"

[project.scripts]
billwright = "billwright.main:main"
# Optional, and only useful with the `mcp` extra installed. An MCP client
# launches this over stdio; see README "Serving it over MCP".
billwright-mcp = "billwright.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "fastmcp>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "pypdf>=4",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "fastmcp>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billwright"]

# The operating manual, served verbatim by the MCP server as the
# `billwright://agents` resource. Tracked once at the repository root and copied
# in at build time: a second tracked copy is the one that goes stale.
[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "billwright/AGENTS.md"
# The fictional sample profile, for the same reason: `init-profile` starts from
# its brand, and an installed copy has no clone to take it from.
"example" = "billwright/example"

[tool.billwright]
# The active company profile. Everything company-specific lives under data/ and
# assets/; the package itself holds no company facts at all. Point this at a
# different directory to bill for a different company from the same engine.
# See skills/README.md for the split.
#
# This is a candidate, not a demand: it is used only if it holds company.toml,
# so a clone with no profile of its own falls through to example/ and renders
# the sample. --profile and $BILLWRIGHT_PROFILE take precedence and are strict.
profile = "data"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Ruff formats Python code blocks inside Markdown. The snippets in AGENTS.md and
# skills/ are illustrative — the colour-conversion matrix is aligned on purpose,
# and reformatting it to one-operator-per-space makes it harder to check against
# the OKLab reference. Prose is documentation, not code held to this style.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
warn_unused_configs = true

# Neither `qrbill` nor `weasyprint` ships type information. Scoped to that package rather than a
# blanket ignore_missing_imports, so a genuinely missing stub elsewhere still
# shows up.
[[tool.mypy.overrides]]
module = ["qrbill.*", "weasyprint.*"]
ignore_missing_imports = true
