# 2026 — a year with actual figures, so the example profile demonstrates a real
# statement and not only the nil case in 2025.toml.
#
# Revenue is not here, and must never be: it is aggregated from the bills that
# were *paid* in 2026, so the figure the tax office sees cannot drift from the
# invoices behind it. Only what the bills cannot know is recorded here —
# expenses, and the balance figures at 31.12.
#
# RE-26002 was issued in December 2026 and paid in January 2027, so it is 2027
# income and is deliberately absent from these accounts.

