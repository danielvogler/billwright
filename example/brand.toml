# Visual tokens, injected as CSS custom properties at render time.
#
# Deliberately neutral: near-black text, greys, one restrained accent. This is
# the default look of the tool, so it has to be presentable on its own rather
# than a placeholder that everyone immediately has to replace.
#
# The token names are the contract with the stylesheets. Add tokens freely — the
# loader passes the whole [colors] table through, so a new one needs no Python
# change — but do not remove these.

# The typeface. Without `faces`, the Inter faces shipped with billwright are
# embedded. To use another, put its files in this directory and declare one
# static face per weight; the stylesheets use 400, 500 and 600. .otf or .ttf.
#
#   font_family = "Archivo"
#   faces = [
#     { file = "fonts/Archivo-Regular.otf",  weight = 400 },
#     { file = "fonts/Archivo-Medium.otf",   weight = 500 },
#     { file = "fonts/Archivo-SemiBold.otf", weight = 600 },
#   ]
font_family = "Inter"

[colors]
ink = "#14171A"
muted = "#6B7280"
rule = "#D9DDE1"
accent = "#2F5C86"
accent-soft = "#DCE6EF"
accent-faint = "#F1F5F9"
paper = "#FFFFFF"

# The wordmark is typeset in the brand font, so it stays sharp at any size and
# in step with the rest of the document. Every key is optional; omit the whole
# table for no wordmark at all.
#
#   mark     a logo file in this directory (.svg or .png), drawn before the text
#   line1    an optional first line above the main one
#   line2    the main line
#   accent   text straight after line2, in the accent colour
#   dot      a closing mark in the accent colour; "" for none, "." if absent
#   tagline  a small line underneath, usually the website
#
# The lowercase setting comes from styles/overrides.css, the profile's own CSS.
[wordmark]
mark = "mark.svg"
line2 = "bill"
accent = "wright"
dot = ""
tagline = "example.com"
